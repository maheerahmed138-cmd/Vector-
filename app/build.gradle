plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mobashir.vector'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mobashir.vector'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
}

dependencies {
    // Android Media3 ExoPlayer with HLS (.m3u8) streaming support
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.5.1'
    implementation 'androidx.media3:media3-ui:1.5.1'
}
